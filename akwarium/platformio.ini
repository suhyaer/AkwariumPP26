[platformio]
default_envs = sim

; SPRZET: prawdziwy ESP32 + HX710B (uzywane od dnia z fizycznym montazem)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.9.1
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    claws/BH1750@^1.3.0

; SYMULACJA Wokwi: to samo, ale czujnik cisnienia i ADC zastapione potencjometrami
[env:sim]
extends = env:esp32dev
build_flags = -DSIMULATION

; Test watchdoga w symulatorze: petla zawiesza sie po 20 s, po ok. 10 s ESP32 ma sie zrestartowac
[env:wdttest]
extends = env:esp32dev
build_flags = -DSIMULATION -DWDT_TEST

; Firmware diagnostyczny do pierwszego uruchomienia SPRZETU (skaner I2C/1-Wire, test przekaznika, kalibracja)
[env:bringup]
extends = env:esp32dev
build_flags = -DBRINGUP

; To samo w symulatorze Wokwi (do obejrzenia dzialania bez sprzetu)
[env:bringup_sim]
extends = env:esp32dev
build_flags = -DBRINGUP -DSIMULATION

; Samotest filtra i przeliczen na ESP32/Wokwi (bez gcc na PC). Budowanie: pio run -e selftest
[env:selftest]
extends = env:esp32dev
build_flags = -DSELFTEST

; Testy jednostkowe na komputerze (wymaga gcc):  pio test -e native
[env:native]
platform = native
build_flags = -Isrc -std=gnu++17
build_src_filter = -<*> +<MovingAverage.cpp>
test_build_src = yes
